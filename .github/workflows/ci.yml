name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate and exercise self-spec
        run: |
          python -m specctl validate spec/solution.json
          python -m specctl order spec/solution.json
          python -m specctl impact spec/solution.json spec-model --direction consumers
          python -m specctl resolve spec/solution.json
      - name: Verify pinned generated candidate
        run: python -m specctl candidate verify-current
